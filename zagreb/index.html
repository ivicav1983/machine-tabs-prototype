function groupOf(l) { return l.dup_group ? (groupMembers[l.dup_group] || [l]) : [l]; }

function sellerOf(l) {
  // who published: index gives the real username; njuskalo list pages carry
  // nothing, so a merged row borrows the info from its index sibling
  const named = groupOf(l).find(m => m.seller_name);
  if (named) return named.seller_name;
  const typed = groupOf(l).find(m => m.seller_type);
  return typed ? (typed.seller_type === "agency" ? "Agencija" : "Privatni") : null;
}

function republishedFrom(l) {
  // a removed group member whose removal happened around this ad's arrival
  // = the seller deleted the old ad and posted this one "as new"
  if (l.status !== "active" || !l.dup_group) return null;
  return groupOf(l).find(m => m.status === "removed" && m.id !== l.id
    && m.removed_at && l.first_seen >= m.removed_at.slice(0, 10)) || null;
}

function refreshDate(l) {
  // index reports renewalTime; njuskalo overwrites its publish date on
  // renewal, so a posted date newer than the first one we saw = a bump
  const first = l.posted_first || l.posted;
  if (l.refreshed && l.refreshed !== first) return l.refreshed;
  if (l.posted && l.posted_first && l.posted !== l.posted_first) return l.posted;
  return null;
}

function priceCell(l, merged) {
  // every historical price stays visible: valuable info, never lost -
  // including prices of removed predecessor ads (delete-and-republish)
  let out = `<strong>${fmtEur(l.price)}</strong>`;
  const changes = trailChanges(l, merged);
  for (let i = changes.length - 1; i >= 0; i--)
    out += `<div class="oldprice" title="price until ${fmtD(changes[i].ts)}">${fmtEur(changes[i].from)} · ${fmtD(changes[i].ts)}</div>`;
  return out;
}

function sellerTypeOf(l) {
  const typed = groupOf(l).find(m => m.seller_type);
  return typed ? typed.seller_type : null;
}
function periodCutoff() {
  const v = document.getElementById("f-period").value;
  if (v === "all") return null;
  return new Date(Date.now() - (+v) * 864e5).toISOString().slice(0, 10);
}

function visibleListings() {
  const neigh = document.getElementById("f-neigh").value;
  const src = document.getElementById("f-src").value;
  const seller = document.getElementById("f-seller").value;
  const cutoff = periodCutoff();
  const merge = document.getElementById("f-merge").checked;
  MERGE = merge;
  const dupOnly = document.getElementById("f-duponly").checked;

  let rows = DATA.listings.filter(l => {
    if (tab === "removed") { if (l.status !== "removed") return false; }
    else if (l.status !== "active") return false;
    // the Period filter means one plain thing per tab (hidden on All):
    // New = first appearance in period, Removed = removed in period,
    // Price changes = last change in period
    if (tab === "new") {
      if (l.first_seen <= DATA.first_run) return false;
      if (cutoff && l.first_seen < cutoff) return false;
    }
    if (tab === "removed" && cutoff && (l.removed_at || "") < cutoff) return false;
    if (tab === "changes") {
      const ch = trailChanges(l, merge);
      if (ch.length === 0) return false;
      if (cutoff && ch[ch.length - 1].ts < cutoff) return false;
    }
    if (neigh && l.neighborhood !== neigh) return false;
    if (src && l.source !== src) return false;
    if (seller === "__agency" && sellerTypeOf(l) !== "agency") return false;
    if (seller === "__private" && sellerTypeOf(l) !== "private") return false;
    if (seller && !seller.startsWith("__") && sellerOf(l) !== seller) return false;
    if (dupOnly && !l.dup_group) return false;
    return true;
  });
  if (merge) {
    const seen = new Set();
    rows = rows.filter(l => {
      if (!l.dup_group) return true;
      if (seen.has(l.dup_group)) return false;
      seen.add(l.dup_group);
      return true;
    }).map(l => {
      if (!l.dup_group) return l;
      // primary = member matching the tab's status (a republished group holds
      // removed predecessors too - the LIVE ad must represent it on active
      // tabs), preferring the index copy (richer fields)
      const members = groupMembers[l.dup_group];
      const primary = members.find(m => m.status === l.status && m.source === "index")
        || members.find(m => m.status === l.status) || l;
      return primary;
    });
    const seen2 = new Set();
    rows = rows.filter(l => { const k = l.dup_group ? "g" + l.dup_group : "i" + l.id; if (seen2.has(k)) return false; seen2.add(k); return true; });
  }
  const col = visibleCols().find(c => c.k === sortKey);
  if (col && col.sort) rows.sort((a, b) => {
    const va = col.sort(a), vb = col.sort(b);
    if (va < vb) return -sortDir;
    if (va > vb) return sortDir;
    // tie-break: keep members of one duplicate group on adjacent lines,
    // otherwise the unmerged copies drift far apart (all baseline listings
    // share the same first_seen timestamp)
    const ga = a.dup_group ? "g" + a.dup_group : "i" + a.id;
    const gb = b.dup_group ? "g" + b.dup_group : "i" + b.id;
    return ga < gb ? -1 : ga > gb ? 1 : 0;
  });
  return rows;
}

function srcLinks(l, merged) {
  // all group links ONLY on the merged row; an unmerged row is one ad = one
  // link. Removed group members stay listed (greyed) so the old ad of a
  // delete-and-republish is still reachable.
  let members = [l];
  if (merged && l.dup_group) {
    members = (groupMembers[l.dup_group] || [l]).slice()
      .sort((a, b) => (a.status === "active" ? 0 : 1) - (b.status === "active" ? 0 : 1));
    if (!members.some(m => m.status === "active")) members = [l];
  }
  return members.map(m => m.status === "active"
    ? `<a class="srcitem ${m.source === "njuskalo" ? "nj" : "ix"}" href="${m.url}" target="_blank">${m.source === "njuskalo" ? "Njuškalo" : "Index"} · ${fmtEur(m.price)} ↗</a>`
    : `<a class="srcitem rm" href="${m.url}" target="_blank" title="ad removed ${fmtD(m.removed_at)}">${m.source === "njuskalo" ? "Njuškalo" : "Index"} · ${fmtEur(m.price)} · ✕ ${fmtD(m.removed_at)}</a>`
  ).join("");
}

function rowBadges(l, newDays, merged) {
  let out = "";
  const rep = republishedFrom(l);
  if (l.status === "removed") {
    out += `<span class="badge rem">removed ${fmtD(l.removed_at)}</span>`;
    if (groupOf(l).some(m => m.status === "active" && m.id !== l.id
        && m.first_seen >= (l.removed_at || "").slice(0, 10)))
      out += `<span class="badge relist">→ re-published</span>`;
  } else if (rep) {
    out += `<span class="badge relist" title="old ad removed ${fmtD(rep.removed_at)}">↻ re-published, was ${fmtEur(rep.price)}</span>`;
  } else if (isNew(l, newDays)) {
    out += `<span class="badge new">NEW</span>`;
  }
  const lc = lastChange(l, merged);
  if (lc) {
    const pct = ((lc.to - lc.from) / lc.from * 100).toFixed(1);
    out += lc.to < lc.from
      ? `<span class="badge drop">▼ ${pct}% (${fmtD(lc.ts)})</span>`
      : `<span class="badge up">▲ +${pct}% (${fmtD(lc.ts)})</span>`;
  }
  if (DATA.events.some(e => e.listing_id === l.id && e.type === "relisted")) out += `<span class="badge relist">relisted</span>`;
  return out;
}

function render() {
  const newDays = 3;  // NEW badge window is fixed; the Period filter is separate
  const periodWrap = document.getElementById("period-wrap");
  periodWrap.style.display = tab === "all" ? "none" : "";
  document.getElementById("period-label").textContent =
    tab === "new" ? "Appeared in" : tab === "removed" ? "Removed in" : "Changed in";
  const rows = visibleListings();
  // header
  document.getElementById("headrow").innerHTML = visibleCols().map(c =>
    `<th data-k="${c.k}" class="${c.cls||""}">${c.label}${sortKey===c.k ? ` <span class="arr">${sortDir>0?"▲":"▼"}</span>`:""}</th>`).join("");
  document.querySelectorAll("#headrow th").forEach(th => th.onclick = () => {
    const k = th.dataset.k, col = visibleCols().find(c => c.k === k);
    if (!col || !col.sort) return;
    if (sortKey === k) sortDir *= -1; else { sortKey = k; sortDir = k === "title" || k === "neighborhood" ? 1 : -1; }
    render();
  });
  const mergeOn = document.getElementById("f-merge").checked;
  const body = rows.map(l => {
    const d = delta(l, mergeOn);
    const lc = lastChange(l, mergeOn);
    const cls = l.status === "removed" ? "removed-row" : lc && lc.to < lc.from ? "drop-row" : isNew(l, newDays) && !republishedFrom(l) ? "new-row" : "";
    return `<tr class="${cls}">
      <td class="title"><a href="${l.url}" target="_blank">${l.title}</a>${rowBadges(l, newDays, mergeOn)}</td>
      <td>${srcLinks(l, mergeOn)}</td>
      <td>${l.neighborhood || "—"}</td>
      <td class="hide-sm">${sellerOf(l) || "—"}</td>
      <td class="num-cell">${l.area_m2 ? l.area_m2.toLocaleString("hr-HR") : "—"}</td>
      <td class="num-cell hide-sm">${l.year_built || "—"}</td>
      <td class="num-cell">${priceCell(l, mergeOn)}</td>
      <td class="num-cell">${l.price_m2 ? Math.round(l.price_m2).toLocaleString("hr-HR") : "—"}</td>
      <td class="num-cell">${d == null ? '<span class="muted">–</span>' : `<span class="${d < 0 ? "delta-down" : "delta-up"}">${d > 0 ? "+" : ""}${d.toFixed(1)}%</span>`}</td>
      <td class="muted">${fmtD(l.first_seen)}</td>
      <td class="muted" style="white-space:nowrap">${fmtD(l.posted_first || l.posted)}</td>
      <td class="muted" style="white-space:nowrap">${refreshDate(l) ? "↻ " + fmtD(refreshDate(l)) : "—"}</td>
      ${tab === "removed" ? `<td class="muted" style="white-space:nowrap">${fmtD(l.removed_at)}</td>` : ""}
    </tr>`;
  }).join("");
  document.getElementById("tbody").innerHTML = body || `<tr><td colspan="${visibleCols().length}" class="muted" style="padding:24px">No listings match.</td></tr>`;
  document.getElementById("countline").textContent = rows.length + " listings shown";
}

function init() {
  document.getElementById("gen").textContent = "updated " + DATA.generated.replace("T", " ");
  const chips = Object.entries(DATA.sources).map(([s, st]) =>
    `<span class="${st.ok ? "" : "bad"}">${s === "njuskalo" ? "Njuškalo" : "Index"}: ${st.ok ? st.count + " ✓" : "FAILED ✗"}</span>`).join("");
  document.getElementById("srcchips").innerHTML = chips;

  const active = DATA.listings.filter(l => l.status === "active");
  const uniqueActive = new Set(active.map(l => l.dup_group ? "g" + l.dup_group : "i" + l.id)).size;
  const new7 = new Set(active.filter(l => isNew(l, 7) && !republishedFrom(l)).map(l => l.dup_group ? "g" + l.dup_group : "i" + l.id)).size;
  const week = new Date(Date.now()-7*864e5).toISOString().slice(0,10);
  const drops7 = active.filter(l => { const c = lastChange(l, true); return c && c.to < c.from && c.ts >= week; }).length;
  const raises7 = active.filter(l => { const c = lastChange(l, true); return c && c.to > c.from && c.ts >= week; }).length;
  const removed7 = DATA.listings.filter(l => l.status === "removed" && l.removed_at >= week).length;
  document.getElementById("cards").innerHTML = `
    <div class="card"><div class="num">${uniqueActive}</div><div class="lbl">active (unique)</div></div>
    <div class="card green"><div class="num">${new7}</div><div class="lbl">new · 7 days</div></div>
    <div class="card amber"><div class="num">${removed7}</div><div class="lbl">removed · 7 days</div></div>
    <div class="card blue"><div class="num">${drops7}</div><div class="lbl">price drops · 7 days</div></div>
    <div class="card red"><div class="num">${raises7}</div><div class="lbl">price raises · 7 days</div></div>`;

  const neighs = [...new Set(DATA.listings.map(l => l.neighborhood).filter(Boolean))].sort();
  const sel = document.getElementById("f-neigh");
  neighs.forEach(n => { const o = document.createElement("option"); o.value = o.textContent = n; sel.appendChild(o); });

  const sellers = [...new Set(DATA.listings.map(l => l.seller_name).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b, "hr"));
  const ssel = document.getElementById("f-seller");
  sellers.forEach(n => { const o = document.createElement("option"); o.value = o.textContent = n; ssel.appendChild(o); });

  document.querySelectorAll(".tab").forEach(b => b.onclick = () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    tab = b.dataset.tab;
    if (tab === "changes") { sortKey = "delta"; sortDir = 1; }
    if (tab === "new") { sortKey = "first_seen"; sortDir = -1; }
    if (tab === "removed") { sortKey = "removed_at"; sortDir = -1; }
    else if (sortKey === "removed_at") { sortKey = "first_seen"; sortDir = -1; }
    render();
  });
  ["f-neigh","f-src","f-seller","f-period","f-merge","f-duponly"]
    .forEach(id => document.getElementById(id).addEventListener("input", render));
  document.getElementById("f-reset").onclick = () => {
    document.getElementById("f-neigh").value = ""; document.getElementById("f-src").value = "";
    document.getElementById("f-seller").value = "";
    document.getElementById("f-period").value = "7";
    document.getElementById("f-merge").checked = true; document.getElementById("f-duponly").checked = false;
    render();
  };
  render();
}
init();
</script>
</body>
</html>
